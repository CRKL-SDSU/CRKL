---
components:
  schemas:
    LaunchDetail:
      type: object
      properties:
        launch_id:
          type: integer
        source_provider:
          type: string
        source_id:
          type: string
        name:
          type: string
        net:
          type: string
          format: date-time
        status:
          type: string
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        image_url:
          type: string
          format: uri
        missions:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LaunchListResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            type: object
