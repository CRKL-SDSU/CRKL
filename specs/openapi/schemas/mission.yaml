---
components:
  schemas:
    MissionDetail:
      type: object
      properties:
        mission_id:
          type: integer
        source_provider:
          type: string
        source_id:
          type: string
        name:
          type: string
        description:
          type: string
        target_body:
          type: string
        status:
          type: string
          nullable: true
          description: Launch Library 2 missions have no status, so this is usually null.
        image_url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
          description: A smaller version of image_url for result cards
        image_credit:
          type: string
          nullable: true
          description: Who took or owns the image
        image_license:
          type: string
          nullable: true
          description: The image's license name (often "Unknown")
        agencies:
          type: array
          items:
            type: object
        spacecraft:
          type: array
          items:
            type: object
        launches:
          type: array
          items:
            type: object
        tags:
          type: array
          items:
            $ref: './tag.yaml#/components/schemas/Tag'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MissionListResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            type: object
