---
paths:
  missions_collection:
    get:
      summary: List missions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/mission.yaml#/components/schemas/MissionListResponse'

  mission_item:
    get:
      summary: Get mission details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/mission.yaml#/components/schemas/MissionDetail'
