---
paths:
  spacecraft_collection:
    get:
      summary: List spacecraft
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: search
          in: query
          description: >-
            Gmail-style query. Words are combined with AND; `OR` (uppercase) matches either side;
            `-term` excludes; `"a phrase"` matches exactly; `tag:moon` or `tag:"ocean worlds"` matches
            mission tags (other resources match through their missions); parentheses group terms.
            Malformed queries return 400.
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/spacecraft.yaml#/components/schemas/SpacecraftListResponse'
        '400':
          description: The search query is malformed

  spacecraft_item:
    get:
      summary: Get spacecraft details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/spacecraft.yaml#/components/schemas/SpacecraftDetail'
