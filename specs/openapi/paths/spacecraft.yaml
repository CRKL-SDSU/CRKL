---
paths:
  spacecraft_collection:
    get:
      summary: List spacecraft
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: search
          in: query
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/spacecraft.yaml#/components/schemas/SpacecraftListResponse'

  spacecraft_item:
    get:
      summary: Get spacecraft details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../schemas/spacecraft.yaml#/components/schemas/SpacecraftDetail'
